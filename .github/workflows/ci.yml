name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: Lint, static analysis and PHP checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install node packages
        run: npm ci

      - name: Build
        run: npm run build

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, openssl, zlib
          coverage: none

      - name: Install php packages
        run: composer install --no-interaction --no-progress

      # tests/run.sh runs ESLint, the translation check, PHPStan and all php
      # checks. It runs crypt15, memdb and reader in a PHP image through docker.
      - name: Lint, translations, PHPStan and PHP checks
        run: SKIP_INTEGRATION=1 ./tests/run.sh

  integration:
    name: Integration test (Nextcloud ${{ matrix.nextcloud }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        nextcloud: ['32', '33', '34', '35']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # the container serves js/, which is built and not stored in git
      - name: Install node packages
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run the integration test
        run: ./tests/nc_integration.sh
        env:
          IMAGE: nextcloud:${{ matrix.nextcloud }}-apache
